*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#1A1512;--bg-deep:#12100D;--fg:#F5EDE4;--accent:#E06030;--muted:#9A8D80;
--card-bg:rgba(245,237,228,.03);--card-border:rgba(154,141,128,.1);
--serif:'Fraunces',Georgia,serif;--sans:'DM Sans',sans-serif;--mono:'JetBrains Mono',monospace;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-decoration:none;transition:opacity .2s}
a:hover{opacity:.8}

/* Nav */
nav{display:flex;justify-content:space-between;align-items:center;padding:18px 40px;position:sticky;top:0;z-index:100;background:rgba(26,21,18,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--card-border)}
.nav-logo{font-family:var(--mono);font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--fg);text-decoration:none;display:flex;align-items:center;gap:10px}
.nav-logo svg{width:22px;height:22px}
.nav-links{display:flex;align-items:center;gap:24px}
.nav-links a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:500;letter-spacing:.5px}
.nav-links a:hover{color:var(--fg);opacity:1}

/* Hero */
.profile-hero{padding:80px 40px 60px;max-width:860px;margin:0 auto}
.profile-hero h1{font-family:var(--serif);font-size:3.5rem;font-weight:300;letter-spacing:-1.5px;line-height:1.1;margin-bottom:8px}
.profile-hero h1 em{color:var(--accent);font-style:italic}
.profile-intro{font-size:17px;color:var(--muted);line-height:1.8;margin-top:16px;max-width:720px}
.profile-intro strong{color:var(--accent);font-weight:400}

/* Sections */
.profile-section{padding:40px 40px;max-width:860px;margin:0 auto}
.profile-section + .profile-section{border-top:1px solid var(--card-border)}
.section-eyebrow{font-family:var(--sans);font-weight:600;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent);margin-bottom:20px}

/* Areas of work */
.work-grid{display:grid;gap:32px}
.work-item h3{font-family:var(--serif);font-size:1.4rem;font-weight:300;letter-spacing:-.5px;margin-bottom:8px}
.work-item p{font-size:15px;color:var(--muted);line-height:1.7}
.work-item .work-orgs{font-size:13px;color:var(--muted);margin-top:6px;font-style:italic}
.work-item .work-orgs a{color:var(--accent);text-decoration:none}
.work-item .work-orgs a:hover{opacity:.7}

/* Organizations */
.org-list{display:flex;flex-wrap:wrap;gap:12px}
.org-tag{padding:8px 20px;border:1px solid var(--card-border);border-radius:100px;font-size:13px;color:var(--muted);letter-spacing:.5px;text-decoration:none;transition:all .2s}
a.org-tag:hover{border-color:var(--accent);color:var(--accent);opacity:1}

/* Talks */
.talk-list{display:grid;gap:12px}
.talk-item{padding:16px 0;border-bottom:1px solid var(--card-border);font-family:var(--serif);font-size:1.1rem;font-weight:300;letter-spacing:-.3px}
.talk-item:first-child{border-top:1px solid var(--card-border)}
.talk-item a{color:var(--fg)}
.talk-item a:hover{color:var(--accent);opacity:1}

/* Source links */
.source-group{margin-bottom:28px}
.source-group:last-child{margin-bottom:0}
.source-group h3{font-family:var(--serif);font-size:1.1rem;font-weight:400;margin-bottom:16px;color:var(--fg)}
.source-list{display:grid;gap:8px}
.source-list a{font-size:14px;color:var(--muted);display:block;padding:8px 0;border-bottom:1px solid rgba(154,141,128,.06);transition:all .2s}
.source-list a:hover{color:var(--accent);padding-left:8px;opacity:1}

/* Media */
.media-list{display:flex;flex-wrap:wrap;gap:12px}
.media-tag{padding:8px 20px;border:1px solid var(--card-border);border-radius:100px;font-size:13px;color:var(--muted)}

/* Themes */
.theme-list{display:flex;flex-wrap:wrap;gap:10px}
.theme-tag{padding:6px 16px;border-radius:100px;background:var(--card-bg);font-size:12px;color:var(--muted);letter-spacing:.5px}

/* Footer */
footer{padding:40px;border-top:1px solid var(--card-border);display:flex;justify-content:space-between;align-items:center;max-width:860px;margin:40px auto 0}
.footer-left{font-size:11px;color:var(--muted);letter-spacing:1px;display:flex;align-items:center;gap:10px}
.footer-left svg{width:22px;height:22px}
.footer-links{display:flex;gap:20px}
.footer-links a{font-size:12px;color:var(--muted)}
